<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随笔卡片 · 管理</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --text-lighter: #94a3b8;
            --border: #e8ecf1;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.10);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            padding: 20px 16px 40px;
            background: var(--bg);
            background-image: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text);
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ===== 顶部标签导航 ===== */
        .nav-tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .nav-tabs button {
            flex: 1;
            background: transparent;
            color: var(--text-light);
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-tabs button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .nav-tabs button:not(.active):hover {
            background: rgba(99, 102, 241, 0.08);
            color: var(--primary);
        }

        /* ===== 标题 ===== */
        h2 {
            font-size: 18px;
            margin: 0 0 16px;
            color: var(--text);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.01em;
        }

        h2::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, var(--primary), var(--purple));
            border-radius: 4px;
        }

        /* ===== 卡片容器 ===== */
        section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 输入框 ===== */
        input[type="text"],
        textarea {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 15px;
            margin: 8px 0;
            outline: none;
            transition: all 0.2s ease;
            background: #fafbfc;
            color: var(--text);
            font-family: inherit;
        }

        input[type="text"]:hover,
        textarea:hover {
            border-color: #d5dae2;
            background: #fff;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        /* ===== 按钮 ===== */
        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            color: #fff;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 7px 12px;
            font-size: 13px;
            width: auto;
            margin: 2px;
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-qr {
            background: #ecfdf5;
            color: var(--success);
        }

        .btn-qr:hover {
            background: var(--success);
            color: #fff;
        }

        .btn-edit {
            background: #fffbeb;
            color: var(--warning);
        }

        .btn-edit:hover {
            background: var(--warning);
            color: #fff;
        }

        .btn-del {
            background: #fef2f2;
            color: var(--danger);
        }

        .btn-del:hover {
            background: var(--danger);
            color: #fff;
        }

        .btn-view {
            background: var(--primary-light);
            color: var(--primary);
        }

        .btn-view:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ===== 卡片列表项 ===== */
        .note-item {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin: 10px 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fff;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .note-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--primary), var(--purple));
            opacity: 0;
            transition: opacity 0.25s;
        }

        .note-item:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .note-item:hover::before {
            opacity: 1;
        }

        .note-thumb {
            width: 68px;
            height: 68px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-lighter);
            font-size: 11px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .note-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .note-body {
            flex: 1;
            min-width: 0;
        }

        .note-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .note-content {
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.55;
            margin-bottom: 8px;
            white-space: pre-wrap;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-meta {
            font-size: 12px;
            color: var(--text-lighter);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .note-meta .public-badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .public-badge.yes {
            background: #ecfdf5;
            color: var(--success);
        }

        .public-badge.no {
            background: #f8fafc;
            color: var(--text-lighter);
        }

        .note-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* ===== 标签 ===== */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag .remove-tag {
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .tag .remove-tag:hover {
            opacity: 1;
        }

        .tag-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tag-filter button {
            background: #f8fafc;
            color: var(--text-light);
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 20px;
            width: auto;
            margin: 0;
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .tag-filter button:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary-light);
        }

        .tag-filter button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.3);
        }

        /* ===== 预览框 ===== */
        .preview-box {
            margin: 12px 0;
            padding: 12px;
            border: 1.5px dashed var(--border);
            border-radius: 12px;
            background: #fafbfc;
            animation: fadeIn 0.3s ease;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            display: block;
            box-shadow: var(--shadow-sm);
        }

        .preview-box audio {
            width: 100%;
            margin-top: 6px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0;
            padding: 12px 14px;
            background: #fafbfc;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            transition: all 0.2s;
        }

        .checkbox-row:hover {
            border-color: #d5dae2;
        }

        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-row label {
            cursor: pointer;
            font-size: 14px;
            color: var(--text-light);
            user-select: none;
        }

        #recordAudioBtn {
            background: linear-gradient(135deg, var(--purple), #a78bfa);
            color: white;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        #recordAudioBtn:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
            transform: translateY(-1px);
        }

        #recordAudioBtn.recording {
            background: linear-gradient(135deg, var(--danger), #f87171);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
            }

            50% {
                box-shadow: 0 4px 24px rgba(239, 68, 68, 0.6);
            }
        }

        /* ===== 文件上传美化 ===== */
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1.5px dashed var(--border);
            border-radius: 12px;
            background: #fafbfc;
            font-size: 14px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            margin: 8px 0;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        input[type="file"]::file-selector-button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            margin-right: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--primary-hover);
        }

        /* ===== 标签输入行 ===== */
        .tag-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        .tag-input-row input {
            flex: 1;
            margin: 0;
        }

        .tag-input-row button {
            width: auto;
            background: var(--primary);
            color: #fff;
            padding: 13px 18px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .tag-input-row button:hover {
            background: var(--primary-hover);
        }

        /* ===== 弹窗 ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            background: #fff;
            padding: 26px;
            border-radius: 20px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-box.wide {
            max-width: 600px;
            text-align: left;
        }

        .modal canvas {
            max-width: 240px;
            margin: 14px auto;
            display: block;
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .modal-close {
            margin-top: 16px;
            background: #f1f5f9;
            color: var(--text-light);
            width: 100%;
            font-weight: 500;
        }

        .modal-close:hover {
            background: #e2e8f0;
            color: var(--text);
        }

        .detail-img {
            width: 100%;
            border-radius: 12px;
            margin: 12px 0;
            box-shadow: var(--shadow-sm);
        }

        .detail-content {
            white-space: pre-wrap;
            line-height: 1.75;
            color: var(--text);
            margin: 12px 0;
            font-size: 15px;
        }

        .detail-time {
            color: var(--text-lighter);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 12px;
            color: var(--primary);
            font-size: 14px;
        }

        .loading::before {
            content: "";
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-lighter);
        }

        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ===== 移动端优化 ===== */
        @media (max-width: 480px) {
            body {
                padding: 14px 12px 32px;
            }

            section {
                padding: 18px;
                border-radius: 14px;
            }

            .note-thumb {
                width: 56px;
                height: 56px;
            }

            .note-title {
                font-size: 15px;
            }

            .note-content {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="nav-tabs">
        <button id="tabEdit" class="active" onclick="switchTab('edit')">✏️ 新建 / 编辑</button>
        <button id="tabList" onclick="switchTab('list')">📋 卡片列表</button>
    </div>

    <!-- ========== 编辑界面 ========== -->
    <div id="editView">
        <h2>极速记录</h2>
        <section>
            <input type="text" id="title" placeholder="给这张卡片起个标题...">
            <textarea id="content" rows="4" placeholder="写下你的随笔文字..."></textarea>

            <div class="tag-input-row">
                <input type="text" id="tagInput" placeholder="输入标签，如：生活 / 灵感">
                <button onclick="addTag()">+ 添加</button>
            </div>
            <div class="tag-list" id="tagList"></div>

            <input type="file" id="imgInput" accept="image/*" capture="environment">
            <div class="preview-box hidden" id="imgPreviewBox">
                <img id="imgPreview" alt="图片预览">
                <button class="btn-sm btn-del" style="margin-top:8px" onclick="clearImage()">移除图片</button>
            </div>

            <button id="recordAudioBtn">🎤 点击开始录音</button>
            <div class="preview-box hidden" id="audioPreviewBox">
                <audio id="audioPreview" controls></audio>
                <button class="btn-sm btn-del" style="margin-top:8px" onclick="clearAudio()">移除录音</button>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="isPublic">
                <label for="isPublic">🌐 开启公开（开启后可通过二维码分享）</label>
            </div>
            <div class="loading" id="submitLoading">保存中...</div>
            <button id="submitBtn" class="btn-primary">✅ 保存卡片</button>
            <button class="btn-primary" style="background:#f1f5f9;color:#64748b;box-shadow:none;margin-top:8px"
                onclick="resetForm()">重置表单</button>
        </section>
    </div>

    <!-- ========== 列表界面 ========== -->
    <div id="listView" class="hidden">
        <h2>我的卡片</h2>
        <section>
            <input type="text" id="searchInput" placeholder="🔍 搜索标题或正文内容...">
            <div class="tag-filter" id="tagFilter"></div>
            <div id="noteList"></div>
        </section>
    </div>

    <!-- 二维码弹窗 -->
    <div class="modal" id="qrModal">
        <div class="modal-box">
            <h3>📱 扫码查看卡片</h3>
            <div id="qrCanvasBox"></div>
            <p style="font-size:13px;color:#94a3b8;margin-top:6px">用手机相机或浏览器扫描</p>
            <button class="modal-close" onclick="closeQrModal()">关闭</button>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-box wide">
            <h3 id="detailTitle" style="margin-bottom:8px"></h3>
            <div class="detail-time" id="detailTime"></div>
            <div class="tag-list" id="detailTags"></div>
            <div class="detail-content" id="detailContent"></div>
            <div id="detailImgBox"></div>
            <div id="detailAudioBox"></div>
            <button class="modal-close" onclick="closeDetailModal()">关闭</button>
        </div>
    </div>

    <script>
        // ===== 全局变量 =====
        const API_BASE = "";
        const TUNNEL_URL = "https://ml21.pythonanywhere.com"; // ← 改成你当前的公网地址
        let mediaRecorder = null;
        let audioBlob = null;
        let editId = null;
        let currentImageFile = null;
        let currentTags = [];
        let allTags = [];
        let activeTag = "";
        let isRecording = false;

        // ===== 界面切换 =====
        function switchTab(tab) {
            document.getElementById("tabEdit").classList.toggle("active", tab === "edit");
            document.getElementById("tabList").classList.toggle("active", tab === "list");
            document.getElementById("editView").classList.toggle("hidden", tab !== "edit");
            document.getElementById("listView").classList.toggle("hidden", tab !== "list");
            if (tab === "list") loadNotes();
        }

        // ===== 标签 =====
        function addTag() {
            const input = document.getElementById("tagInput");
            const val = input.value.trim();
            if (!val) return;
            if (currentTags.includes(val)) { alert("标签已存在"); return; }
            currentTags.push(val);
            input.value = "";
            renderTags();
        }
        function removeTag(tag) {
            currentTags = currentTags.filter(t => t !== tag);
            renderTags();
        }
        function renderTags() {
            const box = document.getElementById("tagList");
            box.innerHTML = "";
            currentTags.forEach(t => {
                const span = document.createElement("span");
                span.className = "tag";
                const text = document.createTextNode(t + " ");
                const x = document.createElement("span");
                x.className = "remove-tag";
                x.textContent = "×";
                x.onclick = () => removeTag(t);
                span.appendChild(text);
                span.appendChild(x);
                box.appendChild(span);
            });
        }

        // ===== 图片压缩 + 预览 =====
        function compressImage(file, maxWidth = 1200, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                        const canvas = document.createElement("canvas");
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => {
                            const compressed = new File([blob], file.name.replace(/\.[^.]+$/, ".jpg"), { type: "image/jpeg" });
                            resolve(compressed);
                        }, "image/jpeg", quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById("imgInput").onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const compressed = await compressImage(file);
            currentImageFile = compressed;
            const url = URL.createObjectURL(compressed);
            document.getElementById("imgPreview").src = url;
            document.getElementById("imgPreviewBox").classList.remove("hidden");
        };
        function clearImage() {
            currentImageFile = null;
            document.getElementById("imgInput").value = "";
            document.getElementById("imgPreviewBox").classList.add("hidden");
        }

        // ===== 录音 =====
        document.getElementById('recordAudioBtn').onclick = async () => {
            const btn = document.getElementById('recordAudioBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioBlob = null;
                    const chunks = [];
                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(chunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        document.getElementById("audioPreview").src = url;
                        document.getElementById("audioPreviewBox").classList.remove("hidden");
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = "⏹️ 停止录音";
                    btn.classList.add("recording");
                } catch (err) {
                    alert("麦克风权限被拒绝，请在浏览器授权麦克风");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.innerText = "🎤 点击开始录音";
                btn.classList.remove("recording");
            }
        };
        function clearAudio() {
            audioBlob = null;
            document.getElementById("audioPreviewBox").classList.add("hidden");
            document.getElementById("audioPreview").src = "";
        }

        // ===== 提交 =====
        document.getElementById('submitBtn').onclick = async () => {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const isPublic = document.getElementById('isPublic').checked ? 1 : 0;
            const loadingDom = document.getElementById("submitLoading");
            loadingDom.style.display = "block";

            try {
                if (editId) {
                    const res = await fetch(`${API_BASE}/api/note/${editId}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title, content, is_public: isPublic, tags: currentTags.join(",") })
                    });
                    const ret = await res.json();
                    if (ret.code === 0) { alert("修改成功"); resetForm(); loadNotes(); }
                    else alert(ret.msg);
                } else {
                    const uuid = crypto.randomUUID();
                    const formData = new FormData();
                    formData.append("id", uuid);
                    formData.append("title", title);
                    formData.append("content", content);
                    formData.append("is_public", isPublic);
                    formData.append("tags", currentTags.join(","));
                    if (currentImageFile) formData.append("img", currentImageFile);
                    if (audioBlob) formData.append("audio", audioBlob, "audio.webm");

                    const res = await fetch(`${API_BASE}/api/note`, { method: "POST", body: formData });
                    const ret = await res.json();
                    if (ret.code === 0) { alert("保存成功"); resetForm(); loadNotes(); }
                    else alert(ret.msg);
                }
            } catch (e) {
                alert("请求异常：" + e.message);
            } finally {
                loadingDom.style.display = "none";
            }
        };

        function resetForm() {
            editId = null;
            document.getElementById('title').value = "";
            document.getElementById('content').value = "";
            document.getElementById('isPublic').checked = false;
            document.getElementById('imgInput').value = "";
            currentImageFile = null;
            document.getElementById("imgPreviewBox").classList.add("hidden");
            audioBlob = null;
            document.getElementById("audioPreviewBox").classList.add("hidden");
            currentTags = [];
            renderTags();
        }

        // ===== 列表加载 =====
        async function loadNotes(keyword = "") {
            const res = await fetch(`${API_BASE}/api/note/list`);
            const ret = await res.json();
            if (ret.code !== 0) return;
            const listDom = document.getElementById("noteList");
            listDom.innerHTML = "";

            allTags = [];
            ret.data.forEach(item => {
                if (item.tags) {
                    item.tags.split(",").forEach(t => {
                        if (t && !allTags.includes(t)) allTags.push(t);
                    });
                }
            });
            renderTagFilter();

            const filterData = ret.data.filter(item => {
                const matchKeyword = (item.title || "").toLowerCase().includes(keyword.toLowerCase()) ||
                    (item.content || "").toLowerCase().includes(keyword.toLowerCase());
                const matchTag = !activeTag || (item.tags || "").split(",").includes(activeTag);
                return matchKeyword && matchTag;
            });

            if (filterData.length === 0) {
                listDom.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">📭</span>
                        <p>还没有卡片，去新建一张吧~</p>
                    </div>
                `;
                return;
            }

            filterData.forEach(item => {
                const div = document.createElement("div");
                div.className = "note-item";
                const timeStr = new Date(item.create_time).toLocaleString();
                const tags = (item.tags || "").split(",").filter(Boolean);
                const tagHtml = tags.map(t => `<span class="tag">${t}</span>`).join("");
                const thumbHtml = item.img_path
                    ? `<div class="note-thumb"><img src="${API_BASE}/uploads/${item.img_path}" alt="缩略图" loading="lazy"></div>`
                    : `<div class="note-thumb">无图</div>`;
                const publicBadge = item.is_public
                    ? `<span class="public-badge yes">🌐 公开</span>`
                    : `<span class="public-badge no">🔒 私密</span>`;
                div.innerHTML = `
                    ${thumbHtml}
                    <div class="note-body">
                        <div class="note-title"></div>
                        <div class="note-content"></div>
                        <div class="tag-list">${tagHtml}</div>
                        <div class="note-meta">${timeStr} ${publicBadge}</div>
                        <div class="note-actions">
                            <button class="btn-sm btn-view" data-action="view">详情</button>
                            <button class="btn-sm btn-qr" data-action="qr">二维码</button>
                            <button class="btn-sm btn-edit" data-action="edit">编辑</button>
                            <button class="btn-sm btn-del" data-action="del">删除</button>
                        </div>
                    </div>
                `;
                div.querySelector(".note-title").textContent = item.title || "无标题";
                div.querySelector(".note-content").textContent = item.content || "无内容";

                div.addEventListener("click", (e) => {
                    if (e.target.tagName === "BUTTON") return;
                    openDetail(item.id);
                });
                div.querySelector('[data-action="view"]').onclick = (e) => { e.stopPropagation(); openDetail(item.id); };
                div.querySelector('[data-action="qr"]').onclick = (e) => { e.stopPropagation(); openQrcode(item.id, item.is_public); };
                div.querySelector('[data-action="edit"]').onclick = (e) => { e.stopPropagation(); editNote(item.id); };
                div.querySelector('[data-action="del"]').onclick = (e) => { e.stopPropagation(); delNote(item.id); };

                listDom.appendChild(div);
            });
        }

        function renderTagFilter() {
            const box = document.getElementById("tagFilter");
            box.innerHTML = "";
            if (allTags.length === 0) return;

            const allBtn = document.createElement("button");
            allBtn.innerText = "全部";
            allBtn.className = activeTag === "" ? "active" : "";
            allBtn.onclick = () => { activeTag = ""; loadNotes(document.getElementById("searchInput").value.trim()); };
            box.appendChild(allBtn);

            allTags.forEach(t => {
                const btn = document.createElement("button");
                btn.innerText = t;
                btn.className = activeTag === t ? "active" : "";
                btn.onclick = () => { activeTag = t; loadNotes(document.getElementById("searchInput").value.trim()); };
                box.appendChild(btn);
            });
        }

        // ===== 编辑 =====
        async function editNote(id) {
            const res = await fetch(`${API_BASE}/api/note/${id}?admin=1`);
            const ret = await res.json();
            if (ret.code !== 0) { alert(ret.msg); return; }
            const item = ret.data;
            editId = id;
            document.getElementById('title').value = item.title;
            document.getElementById('content').value = item.content;
            document.getElementById('isPublic').checked = item.is_public === 1;
            currentTags = (item.tags || "").split(",").filter(Boolean);
            renderTags();
            switchTab('edit');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function delNote(id) {
            if (!confirm("确认永久删除这条随笔卡片？")) return;
            const res = await fetch(`${API_BASE}/api/note/${id}`, { method: "DELETE" });
            const ret = await res.json();
            if (ret.code === 0) { alert("已删除"); loadNotes(); }
        }

        // ===== 二维码 =====
        async function openQrcode(id, isPublic) {
            if (!isPublic) { alert("请先开启卡片【公开】，才可生成访问二维码"); return; }
            const url = `${TUNNEL_URL}/card.html?id=${id}`;
            const modal = document.getElementById("qrModal");
            const box = document.getElementById("qrCanvasBox");
            box.innerHTML = "";
            const canvas = document.createElement("canvas");
            box.appendChild(canvas);
            await QRCode.toCanvas(canvas, url, { width: 240, margin: 1, color: { dark: "#1e293b", light: "#ffffff" } });
            modal.classList.add("show");
        }
        function closeQrModal() { document.getElementById("qrModal").classList.remove("show"); }

        // ===== 详情 =====
        async function openDetail(id) {
            const res = await fetch(`${API_BASE}/api/note/${id}?admin=1`);
            const ret = await res.json();
            if (ret.code !== 0) { alert(ret.msg); return; }
            const item = ret.data;
            document.getElementById("detailTitle").textContent = item.title || "无标题";
            document.getElementById("detailTime").textContent = "创建：" + new Date(item.create_time).toLocaleString();
            document.getElementById("detailContent").textContent = item.content || "";
            const tags = (item.tags || "").split(",").filter(Boolean);
            document.getElementById("detailTags").innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join("");
            document.getElementById("detailImgBox").innerHTML = item.img_path
                ? `<img class="detail-img" src="${API_BASE}/uploads/${item.img_path}" alt="图片">` : "";
            document.getElementById("detailAudioBox").innerHTML = item.audio_path
                ? `<audio controls style="width:100%;margin-top:10px" src="${API_BASE}/uploads/${item.audio_path}"></audio>` : "";
            document.getElementById("detailModal").classList.add("show");
        }
        function closeDetailModal() { document.getElementById("detailModal").classList.remove("show"); }

        // 点击遮罩关闭弹窗
        document.getElementById("qrModal").onclick = (e) => { if (e.target.id === "qrModal") closeQrModal(); };
        document.getElementById("detailModal").onclick = (e) => { if (e.target.id === "detailModal") closeDetailModal(); };

        // 回车添加标签
        document.getElementById("tagInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") { e.preventDefault(); addTag(); }
        });

        document.getElementById("searchInput").oninput = e => loadNotes(e.target.value.trim());

        // 初始化
        renderTags();
        loadNotes();
    </script>
</body>

</html>
