<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>随笔卡片</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #ebe8e0;
            padding: 20px 16px 40px;
            min-height: 100vh;
            color: #1a1a1a;
        }

        .card {
            background: #fff;
            border-radius: 22px;
            padding: 26px;
            max-width: 640px;
            margin: 0 auto;
            border: 1px solid #ebe5d9;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
            animation: fadeInUp 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f0e3a8, #c8d9f0, #d8c8e8, #c8e0d0, #f0c8d8);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 10px;
            line-height: 1.35;
            letter-spacing: -0.02em;
        }

        .card-time {
            font-size: 13px;
            color: #b0aa9c;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-time::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d5cfc0;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: #f0ece0;
            color: #5a5548;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .card-content {
            font-size: 17px;
            line-height: 1.85;
            color: #1a1a1a;
            margin-bottom: 22px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .divider {
            height: 1px;
            background: #ebe5d9;
            margin: 20px 0;
        }

        img {
            width: 100%;
            border-radius: 14px;
            margin: 14px 0;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: block;
        }

        audio {
            width: 100%;
            margin: 10px 0;
            border-radius: 10px;
        }

        .tip {
            text-align: center;
            color: #b0aa9c;
            font-size: 12px;
            margin-top: 28px;
            letter-spacing: 0.05em;
        }

        .tip::before {
            content: "✦ ";
        }

        .tip::after {
            content: " ✦";
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
        }

        .error::before {
            content: "😕";
            display: block;
            font-size: 48px;
            margin-bottom: 12px;
        }

        .loading-card {
            text-align: center;
            padding: 80px 20px;
            color: #b0aa9c;
        }

        .loading-card::before {
            content: "";
            display: block;
            width: 32px;
            height: 32px;
            border: 3px solid #ebe5d9;
            border-top-color: #1a1a1a;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .img-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            margin: 14px 0;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .img-scroll::-webkit-scrollbar {
            display: none;
        }

        .img-scroll img {
            flex: 0 0 85%;
            margin: 0;
            scroll-snap-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 12px 32px;
            }

            .card {
                padding: 22px 20px;
                border-radius: 18px;
            }

            .card-title {
                font-size: 22px;
            }

            .card-content {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="card" id="cardBox">
        <div class="loading-card">加载中...</div>
    </div>
    <div class="tip">图文音随笔卡片</div>

    <script>
        const API_BASE = "";
        const urlParams = new URLSearchParams(window.location.search);
        const noteId = urlParams.get("id");

        async function loadCard() {
            const box = document.getElementById("cardBox");
            if (!noteId) { box.innerHTML = '<p class="error">卡片ID缺失</p>'; return; }

            try {
                const res = await fetch(`${API_BASE}/api/note/${noteId}`);
                const ret = await res.json();
                if (ret.code !== 0) { box.innerHTML = `<p class="error">${ret.msg}</p>`; return; }
                const data = ret.data;

                const tags = (data.tags || "").split(",").filter(Boolean);
                const tagHtml = tags.length
                    ? `<div class="tag-list">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`
                    : "";
                const timeStr = data.create_time ? new Date(data.create_time).toLocaleString() : "";
                const imgPaths = Array.isArray(data.img_paths) && data.img_paths.length
                    ? data.img_paths : (data.img_path ? [data.img_path] : []);

                let imgHtml = "";
                if (imgPaths.length === 1) {
                    imgHtml = `<img src="${API_BASE}/uploads/${imgPaths[0]}" alt="卡片图片">`;
                } else if (imgPaths.length > 1) {
                    imgHtml = `<div class="img-scroll">${imgPaths.map(p => `<img src="${API_BASE}/uploads/${p}" alt="卡片图片">`).join("")}</div>`;
                }

                const audioHtml = data.audio_path
                    ? `<div class="divider"></div><audio controls src="${API_BASE}/uploads/${data.audio_path}">你的浏览器不支持音频</audio>`
                    : "";

                box.innerHTML = `
                    ${data.title ? `<div class="card-title"></div>` : ""}
                    <div class="card-time"></div>
                    ${tagHtml}
                    ${data.content ? `<div class="card-content"></div>` : ""}
                    ${imgHtml}
                    ${audioHtml}
                `;
                if (data.title) box.querySelector(".card-title").textContent = data.title;
                box.querySelector(".card-time").textContent = timeStr;
                if (data.content) box.querySelector(".card-content").textContent = data.content;
            } catch (e) {
                box.innerHTML = `<p class="error">加载失败：${e.message}</p>`;
            }
        }
        loadCard();
    </script>
</body>

</html>
