<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>随笔卡片</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f5f7fb;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.10) 0%, transparent 45%);
            background-attachment: fixed;
            padding: 20px 16px 40px;
            min-height: 100vh;
            color: #1e293b;
        }

        .card {
            background: #fff;
            border-radius: 22px;
            padding: 26px;
            max-width: 640px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
            animation: fadeInUp 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.35;
            letter-spacing: -0.02em;
        }

        .card-time {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-time::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            color: #4f46e5;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 1px 3px rgba(99, 102, 241, 0.15);
        }

        .card-content {
            font-size: 17px;
            line-height: 1.85;
            color: #334155;
            white-space: pre-wrap;
            margin-bottom: 22px;
            word-break: break-word;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 20px 0;
        }

        img {
            width: 100%;
            border-radius: 14px;
            margin: 14px 0;
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.10);
            display: block;
        }

        audio {
            width: 100%;
            margin: 10px 0;
            border-radius: 10px;
        }

        .tip {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 28px;
            letter-spacing: 0.05em;
        }

        .tip::before {
            content: "✦ ";
        }

        .tip::after {
            content: " ✦";
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
        }

        .error::before {
            content: "😕";
            display: block;
            font-size: 48px;
            margin-bottom: 12px;
        }

        .loading-card {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
        }

        .loading-card::before {
            content: "";
            display: block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #6366f1;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 12px 32px;
            }

            .card {
                padding: 22px 20px;
                border-radius: 18px;
            }

            .card-title {
                font-size: 22px;
            }

            .card-content {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="card" id="cardBox">
        <div class="loading-card">加载中...</div>
    </div>
    <div class="tip">图文音随笔卡片</div>

    <script>
        const API_BASE = "";
        const urlParams = new URLSearchParams(window.location.search);
        const noteId = urlParams.get("id");

        async function loadCard() {
            const box = document.getElementById("cardBox");

            if (!noteId) {
                box.innerHTML = '<p class="error">卡片ID缺失</p>';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/note/${noteId}`);
                const ret = await res.json();
                if (ret.code !== 0) {
                    box.innerHTML = `<p class="error">${ret.msg}</p>`;
                    return;
                }
                const data = ret.data;

                const tags = (data.tags || "").split(",").filter(Boolean);
                const tagHtml = tags.length
                    ? `<div class="tag-list">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`
                    : "";

                const timeStr = data.create_time
                    ? new Date(data.create_time).toLocaleString()
                    : "";

                const imgHtml = data.img_path
                    ? `<img src="${API_BASE}/uploads/${data.img_path}" alt="卡片图片">`
                    : "";

                const audioHtml = data.audio_path
                    ? `<div class="divider"></div><audio controls src="${API_BASE}/uploads/${data.audio_path}">你的浏览器不支持音频</audio>`
                    : "";

                box.innerHTML = `
                    <div class="card-title"></div>
                    <div class="card-time"></div>
                    ${tagHtml}
                    <div class="card-content"></div>
                    ${imgHtml}
                    ${audioHtml}
                `;

                // 用 textContent 防止 XSS
                box.querySelector(".card-title").textContent = data.title || "无标题";
                box.querySelector(".card-time").textContent = timeStr;
                box.querySelector(".card-content").textContent = data.content || "";
            } catch (e) {
                box.innerHTML = `<p class="error">加载失败：${e.message}</p>`;
            }
        }
        loadCard();
    </script>
</body>

</html>
